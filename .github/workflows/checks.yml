name: Package and contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - name: Lint package, tests, examples and native validation probes
        run: uv run ruff check src tests examples validation
      - name: Check changed functionality and direct integrations
        run: >-
          uv run pytest -q
          tests/test_contracts.py tests/test_runner.py tests/test_stdio.py
          tests/test_installation.py tests/test_cli.py tests/test_settings.py
          tests/test_scene.py tests/test_animation.py tests/test_motion.py
          tests/test_profiles.py tests/test_characters.py tests/test_character_edit.py
          tests/test_curves.py tests/test_state.py tests/test_recovery.py
          tests/test_dispatch_recovery.py tests/test_playback.py tests/test_exchange.py
          tests/test_workflows.py tests/test_server_resources.py tests/test_subtrees.py
          tests/test_data_channels.py
          tests/test_native_operations.py tests/test_jobs.py tests/test_job_verification.py
      - run: uv pip check
      - run: uv build
      - name: Discover tools from the built wheel in isolation
        run: >-
          uv run python -c "import json,pathlib,subprocess; wheel=max(pathlib.Path('dist').glob('*.whl'),key=lambda path:path.stat().st_mtime_ns); result=subprocess.run(['uvx','--isolated','--python','${{ matrix.python }}','--from',str(wheel),'mcp-for-cascadeur','tools','--json'],check=True,capture_output=True,text=True); tools=json.loads(result.stdout); names={tool['name'] for tool in tools}; assert {'app_status','recovery_verify','character_retime','fbx_export_verified','subtree_restore'}<=names; print('Wheel tools discovered:',len(tools))"
      - name: Check the installed wheel through the official MCP SDK
        run: >-
          uv run python -c "import os,pathlib,subprocess,tempfile; root=pathlib.Path(tempfile.mkdtemp(prefix='cascadeur-wheel-ci-')); environment=root/'venv'; subprocess.run(['uv','venv','--python','${{ matrix.python }}',str(environment)],check=True); python=environment/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); wheel=max(pathlib.Path('dist').glob('*.whl'),key=lambda path:path.stat().st_mtime_ns); subprocess.run(['uv','pip','install','--python',str(python),str(wheel)],check=True); smoke=pathlib.Path('validation/package_smoke.py').resolve(); variables=dict(os.environ); variables.pop('PYTHONPATH',None); subprocess.run([str(python),str(smoke),'--expected-tools','104'],cwd=root,env=variables,check=True)"

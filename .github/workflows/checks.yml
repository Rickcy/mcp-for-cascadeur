name: Package and contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src tests examples
      - run: uv run pytest tests/test_contracts.py tests/test_runner.py tests/test_stdio.py tests/test_installation.py tests/test_cli.py tests/test_settings.py tests/test_scene.py tests/test_animation.py tests/test_motion.py tests/test_profiles.py
      - run: uv build
